services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nivo
      POSTGRES_PASSWORD: nivo
      POSTGRES_DB: nivo
    ports:
      - "5432:5432"
    volumes:
      - nivo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nivo -d nivo"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  nivo-pgdata:
