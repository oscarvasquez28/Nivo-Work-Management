services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nivo
      POSTGRES_PASSWORD: nivo
      POSTGRES_DB: nivo
    ports:
      - "5432:5432"
    volumes:
      - nivo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nivo -d nivo"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    image: nivo-api
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["npm", "run", "migrate"]
    environment:
      DATABASE_URL: postgres://nivo:nivo@db:5432/nivo
    depends_on:
      db:
        condition: service_healthy

  api:
    image: nivo-api
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgres://nivo:nivo@db:5432/nivo
      HOST: 0.0.0.0
      PORT: "4000"
      APP_ORIGIN: http://localhost:3000
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NIVO_API_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  nivo-pgdata:
